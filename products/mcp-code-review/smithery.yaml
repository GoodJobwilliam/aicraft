startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      llmApiKey:
        type: string
        description: "Your LLM API key (OpenAI, Anthropic, or Groq) — optional, for LLM-enhanced reviews"
    required: []
  commandFunction:
    |-
      (config) => ({
        "command": "uv",
        "args": ["run", "--directory", "/app", "mcp-code-review"]
      })
