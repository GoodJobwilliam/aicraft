[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aicraft-code-review"
version = "0.1.1"
description = "Code review as an MCP server — structured reviews with OWASP security scanning"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6,<2",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

yaml = [
    "PyYAML>=6.0",
]

[project.scripts]
mcp-code-review = "mcp_code_review:run"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
