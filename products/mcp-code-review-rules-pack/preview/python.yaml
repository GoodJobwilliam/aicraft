# Representative preview for aicraft-code-review.
# The complete Team Rules Pack adds language-specific coverage and CI templates.
min_severity: info
severity_overrides:
  hardcoded_secret: critical
  command_injection: critical

custom_rules:
  - name: no-eval
    pattern: '\beval\s*\('
    severity: critical
    category: security
    issue: "Dynamic evaluation can execute untrusted input."
    fix: "Use a typed parser or an explicit allowlist."
  - name: no-debug-print
    pattern: '\bprint\s*\('
    severity: info
    category: team-convention
    issue: "Debug output should not reach production paths."
    fix: "Use the approved logger or remove the statement."