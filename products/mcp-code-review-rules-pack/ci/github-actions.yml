name: Code Review (mcp-code-review)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aicraft-code-review
        run: pip install aicraft-code-review

      - name: Run review on changed files
        id: review
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          git diff "$BASE"...HEAD > /tmp/changes.diff
          mcp-code-review review-diff --git-diff /tmp/changes.diff > review-report.txt
          EXIT=$?
          cat review-report.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review-report.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 Code Review (mcp-code-review)\n\n```\n' + report + '\n```'
            });

      - name: Block merge on critical issues
        if: steps.review.outputs.exit_code == '2'
        run: |
          echo "::error::Critical issues found — fix them before merging."
          exit 1
