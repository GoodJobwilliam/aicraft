name: Code Review (mcp-code-review)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  review:
    outputs:
      exit_code: ${{ steps.review.outputs.exit_code }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aicraft-code-review
        run: pip install "aicraft-code-review==0.1.2" "mcp<2"

      - name: Run review on changed files
        id: review
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          git diff "$BASE"...HEAD > /tmp/changes.diff
          mcp-code-review review-diff < /tmp/changes.diff > review-report.txt
          EXIT=$?
          cat review-report.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-code-review-report
          path: review-report.txt
          if-no-files-found: error

      - name: Block merge on critical issues
        if: steps.review.outputs.exit_code == '2'
        run: |
          echo "::error::Critical issues found — fix them before merging."
          exit 1

  comment:
    needs: review
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Download review report
        uses: actions/download-artifact@v4
        with:
          name: mcp-code-review-report

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review-report.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 Code Review (mcp-code-review)\n\n```\n' + report + '\n```'
            });
