name: Trial feedback
description: Share the result of a local MCP Code Review trial
title: "[Trial feedback] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running the trial. Share only non-confidential observations. Do not paste source code, credentials, API keys, or private repository details.

  - type: input
    id: team-size
    attributes:
      label: Team size
      placeholder: e.g. 4
    validations:
      required: true

  - type: input
    id: languages
    attributes:
      label: Main languages
      placeholder: e.g. Python, TypeScript
    validations:
      required: true

  - type: dropdown
    id: discovery-source
    attributes:
      label: How did you find MCP Code Review?
      options:
        - GitHub
        - Official MCP Registry
        - Smithery
        - mcpservers.org or cursor.directory
        - Product Hunt
        - Web search
        - Recommendation
        - Other
    validations:
      required: true

  - type: textarea
    id: caught
    attributes:
      label: What did the trial catch?
      description: Describe the finding category and severity, not private code.
      placeholder: e.g. High command-injection finding and Medium team-convention finding.
    validations:
      required: true

  - type: textarea
    id: shared-rule
    attributes:
      label: Rule to share
      description: Which rule should run in every repository?
    validations:
      required: true

  - type: textarea
    id: noisy
    attributes:
      label: Noisy or missing result
      description: What was noisy, unclear, or missing?
    validations:
      required: true

  - type: dropdown
    id: next-step
    attributes:
      label: Next step
      options:
        - Free server only
        - Test the $49 Team Rules Pack
        - Discuss Team Updates Starter at $19/month or $190/year
        - Discuss Team Pilot at $99/month or $990/year
        - Need scope clarification first
    validations:
      required: true

  - type: dropdown
    id: offer-tier
    attributes:
      label: Offer tier discussed
      description: Select the one commercial path that best matches this feedback. This records interest only; it is not a payment.
      options:
        - Free server only
        - Team Rules Pack
        - Team Updates Starter
        - Team Updates Team Pilot
        - Scope not clear yet
    validations:
      required: true

  - type: dropdown
    id: decision-window
    attributes:
      label: Decision timing
      options:
        - This month
        - Next month
        - This quarter
        - No paid decision planned
    validations:
      required: true

  - type: dropdown
    id: precommitment
    attributes:
      label: Conditional start commitment
      description: If the agreed scope matches the selected tier, would your team start at that price? This is not a charge or subscription.
      options:
        - Yes, subject to confirming scope and start date
        - Maybe, I need more evidence
        - No commitment yet
    validations:
      required: true

  - type: checkboxes
    id: contact
    attributes:
      label: Follow-up
      options:
        - label: I am comfortable receiving a reply in this public issue thread.
          required: true
