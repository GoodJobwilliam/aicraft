name: Trial feedback
description: Share the result of a local MCP Code Review trial
title: "[Trial feedback] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running the trial. Share only non-confidential observations. Do not paste source code, credentials, API keys, or private repository details.

  - type: input
    id: team-size
    attributes:
      label: Team size
      description: Optional. Leave blank if you only want to share the technical result.
      placeholder: e.g. 4

  - type: input
    id: languages
    attributes:
      label: Main languages
      description: Optional. Leave blank if you prefer not to classify the repository.
      placeholder: e.g. Python, TypeScript

  - type: dropdown
    id: discovery-source
    attributes:
      label: How did you find MCP Code Review?
      description: Optional. This helps us understand distribution, but is not needed for feedback.
      options:
        - GitHub
        - Official MCP Registry
        - Smithery
        - mcpservers.org or cursor.directory
        - Product Hunt
        - Web search
        - Recommendation
        - Other

  - type: textarea
    id: caught
    attributes:
      label: What did the trial catch?
      description: Describe the finding category and severity, not private code.
      placeholder: e.g. High command-injection finding and Medium team-convention finding.
    validations:
      required: true

  - type: textarea
    id: shared-rule
    attributes:
      label: Rule to share
      description: Which rule should run in every repository?
    validations:
      required: true

  - type: textarea
    id: noisy
    attributes:
      label: Noisy or missing result
      description: What was noisy, unclear, or missing?
    validations:
      required: true

  - type: dropdown
    id: next-step
    attributes:
      label: Next step
      description: Optional. Leave blank if you are only reporting the technical result.
      options:
        - Free server only
        - Test the $49 Team Rules Pack
        - Discuss Team Updates Starter at $19/month or $190/year
        - Discuss Team Pilot at $99/month or $990/year
        - Need scope clarification first

  - type: dropdown
    id: offer-tier
    attributes:
      label: Offer tier discussed
      description: "Optional: select a commercial path if you already have one in mind. Leaving this blank is fine; this records interest only and is not a payment."
      options:
        - Free server only
        - Team Rules Pack
        - Team Updates Starter
        - Team Updates Team Pilot
        - Scope not clear yet

  - type: dropdown
    id: decision-window
    attributes:
      label: Decision timing
      description: Optional. Leave blank if you are only reporting the technical result.
      options:
        - This month
        - Next month
        - This quarter
        - No paid decision planned

  - type: dropdown
    id: decision-role
    attributes:
      label: Role in the decision
      description: Optional. Which best describes your role when deciding on a paid add-on?
      options:
        - I make the purchase decision
        - I recommend tools to the decision maker
        - I am testing as an engineer
        - I am researching options

  - type: input
    id: target-start-month
    attributes:
      label: Target start month
      description: Optional. If the trial works, which month would you target for starting the selected tier? Use YYYY-MM.
      placeholder: e.g. 2026-10

  - type: dropdown
    id: precommitment
    attributes:
      label: Conditional start commitment
      description: Optional. If the agreed scope matches the selected tier, would your team start at that price? This is not a charge or subscription.
      options:
        - Yes, subject to confirming scope and start date
        - Maybe, I need more evidence
        - No commitment yet

  - type: checkboxes
    id: contact
    attributes:
      label: Follow-up
      options:
        - label: I am comfortable receiving a reply in this public issue thread.
          required: true
