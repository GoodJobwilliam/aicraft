name: 团队试用申请
description: 申请 MCP Code Review 的免费本地团队试用
title: "[团队试用] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        感谢你的关注。这个表单用于验证 MCP Code Review 和 Team Rules Pack 的免费短期团队试用。

        请勿在这里粘贴源代码、凭据、API 密钥或其他机密信息。

  - type: input
    id: team-size
    attributes:
      label: 团队规模
      description: 有多少名工程师会参与试用？
      placeholder: 例如：4
    validations:
      required: true

  - type: input
    id: languages
    attributes:
      label: 主要语言
      description: 试用需要覆盖哪些语言？
      placeholder: 例如：Python、TypeScript
    validations:
      required: true

  - type: dropdown
    id: discovery-source
    attributes:
      label: 你从哪里知道 MCP Code Review？
      options:
        - GitHub
        - 官方 MCP Registry
        - Smithery
        - mcpservers.org 或 cursor.directory
        - Product Hunt
        - 网页搜索
        - 他人推荐
        - 其他
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: 当前审查流程
      description: 本地审查最适合接入你们现有流程的哪个位置？
      options:
        - 编辑器（Claude Code、Cursor 或 Cline）
        - Pull Request
        - CI 流水线
        - 编辑器和 Pull Request
        - 编辑器、Pull Request 和 CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: pain
    attributes:
      label: 最大的审查痛点
      description: 用一两句话描述反复出现的问题，请勿包含私有代码。
      placeholder: 例如：不同仓库的共享规则经常漂移，误报拖慢合并。
    validations:
      required: true

  - type: dropdown
    id: trial-window
    attributes:
      label: 试用时间
      options:
        - 本周
        - 两周内
        - 本月
        - 仅了解一下
    validations:
      required: true

  - type: dropdown
    id: updates-interest
    attributes:
      label: 持续更新意向
      description: 这只是调研，提交表单不会产生收费或订阅。
      options:
        - 我只想使用免费服务器
        - 我愿意测试 $49 Team Rules Pack
        - 我会考虑 $19/月或 $190/年的 Team Updates Starter
        - 我会考虑 $99/月或 $990/年的 Team Pilot
        - 需要先了解具体交付范围
    validations:
      required: true

  - type: dropdown
    id: decision-role
    attributes:
      label: 你在决策中的角色
      description: 哪一项最符合你在本次试用中的角色？
      options:
        - 我负责购买决策
        - 我向决策者推荐工具
        - 我是参与测试的工程师
        - 我只是调研选项
    validations:
      required: true

  - type: dropdown
    id: decision-window
    attributes:
      label: 决策时间
      description: 如果试用有效，团队何时可能决定购买增值服务？
      options:
        - 本月
        - 下月
        - 本季度
        - 暂无付费计划
    validations:
      required: true

  - type: dropdown
    id: precommitment
    attributes:
      label: 有条件的开始承诺
      description: 如果最终范围符合上面选择的档位，你们是否愿意按该价格开始？这不会产生收费或订阅。
      options:
        - 愿意，确认范围和开始时间后开始
        - 可能愿意，还需要更多证据
        - 目前还不能承诺
    validations:
      required: true

  - type: checkboxes
    id: contact
    attributes:
      label: 后续联系
      options:
        - label: 我同意在这个公开 issue 线程中收到回复。
          required: true
