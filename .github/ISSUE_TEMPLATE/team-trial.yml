name: Team trial request
description: Request a free, local-first MCP Code Review team trial
title: "[Team trial] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. This form is for a short, free validation trial of MCP Code Review and the Team Rules Pack.

        Do not paste source code, credentials, API keys, or confidential information here.

  - type: input
    id: team-size
    attributes:
      label: Team size
      description: How many engineers would test the workflow?
      placeholder: e.g. 4
    validations:
      required: true

  - type: input
    id: languages
    attributes:
      label: Main languages
      description: Which languages should the trial cover?
      placeholder: e.g. Python, TypeScript
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Current review workflow
      description: Where would local review fit today?
      options:
        - Editor (Claude Code, Cursor, or Cline)
        - Pull request
        - CI pipeline
        - Editor and pull request
        - Editor, pull request, and CI
        - Other
    validations:
      required: true

  - type: textarea
    id: pain
    attributes:
      label: Biggest review pain
      description: Describe the recurring problem in one or two sentences. Do not include private code.
      placeholder: e.g. Shared rules drift between repositories and false positives slow merges.
    validations:
      required: true

  - type: dropdown
    id: trial-window
    attributes:
      label: Trial timing
      options:
        - This week
        - Within two weeks
        - This month
        - Exploring only
    validations:
      required: true

  - type: dropdown
    id: updates-interest
    attributes:
      label: Ongoing updates interest
      description: This is research only; no charge is created by submitting this form.
      options:
        - I only want the free server
        - I would test the $49 Team Rules Pack
        - I would consider Team Updates Starter at $19/month or $190/year
        - I would consider Team Pilot at $99/month or $990/year
        - I need to understand the scope first
    validations:
      required: true

  - type: dropdown
    id: decision-role
    attributes:
      label: Role in the decision
      description: Which best describes your role for this trial?
      options:
        - I make the purchase decision
        - I recommend tools to the decision maker
        - I am testing as an engineer
        - I am researching options
    validations:
      required: true

  - type: dropdown
    id: decision-window
    attributes:
      label: Decision timing
      description: When could your team decide on a paid add-on if the trial works?
      options:
        - This month
        - Next month
        - This quarter
        - No paid decision planned
    validations:
      required: true

  - type: dropdown
    id: precommitment
    attributes:
      label: Conditional start commitment
      description: If the agreed scope matches the tier above, would you start at that price? This is not a charge or subscription.
      options:
        - Yes, subject to confirming scope and start date
        - Maybe, I need more evidence
        - No commitment yet
    validations:
      required: true

  - type: checkboxes
    id: contact
    attributes:
      label: Follow-up
      options:
        - label: I am comfortable receiving a reply in this public issue thread.
          required: true
