# Smithery configuration
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      llmApiKey:
        type: string
        description: "Your LLM API key (OpenAI, Anthropic, or Groq)"
    required: []
  commandFunction:
    |-
      (config) => ({
        "command": "uv",
        "args": ["run", "--directory", "products/mcp-code-review", "mcp-code-review"]
      })
